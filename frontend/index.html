  bodegas: `<span class="col-chip">Sede</span><span class="col-chip">Pedidos</span><span class="col-chip">NT</span>`,
};

function renderAdmin() {
  const el = document.getElementById('page-admin');
  el.innerHTML = `
    <div class="section-header">
      <h2>Administración</h2>
      <p>Carga de datos · Solo administradores</p>
    </div>
    <div class="tab-bar">
      ${ADMIN_TABS.map(t => `<button class="tab-btn ${t === adminActiveTab ? 'active' : ''}" onclick="adminSetTab('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}
    </div>
    ${ADMIN_TABS.map(t => `
      <div class="tab-content ${t === adminActiveTab ? 'active' : ''}" id="admin-tab-${t}">
        <div class="schema-box"><strong>Columnas esperadas:</strong><br>${SCHEMAS[t]}</div>
        <div class="drop-zone" id="dz-${t}"
          ondragover="adminDragOver(event,'${t}')"
          ondragleave="adminDragLeave(event,'${t}')"
          ondrop="adminDrop(event,'${t}')"
          onclick="document.getElementById('fi-${t}').click()">
          <div class="drop-zone-icon">📂</div>
          <div class="drop-zone-text" id="dz-label-${t}">Arrastra tu archivo Excel/CSV aquí</div>
          <div class="drop-zone-sub">o haz clic para seleccionar</div>
        </div>
        <input type="file" id="fi-${t}" accept=".xlsx,.xls,.csv" style="display:none" onchange="adminFileSelect(event,'${t}')">
        <div id="preview-${t}"></div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
          <button class="btn-success" id="apply-btn-${t}" onclick="adminApply('${t}')" disabled>Aplicar carga</button>
          <button class="btn-secondary" onclick="adminClear('${t}')">Limpiar</button>
          <span id="apply-status-${t}" style="font-size:12px;color:var(--fg2)"></span>
        </div>
      </div>
    `).join('')}

    <div style="margin-top:24px">
      <div class="chart-label" style="margin-bottom:8px">Registro de actividad</div>
      <div class="activity-log" id="activity-log">
        <div style="color:var(--fg3);font-size:12px;padding:10px">Sin actividad reciente.</div>
      </div>
    </div>
  `;
  renderActivityLog();
}

function adminSetTab(t) {
  adminActiveTab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === t));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'admin-tab-' + t));
}

function adminDragOver(e, tipo) {
  e.preventDefault();
  document.getElementById('dz-' + tipo)?.classList.add('drag-over');
}

function adminDragLeave(e, tipo) {
  document.getElementById('dz-' + tipo)?.classList.remove('drag-over');
}

function adminDrop(e, tipo) {
  e.preventDefault();
  document.getElementById('dz-' + tipo)?.classList.remove('drag-over');
  const file = e.dataTransfer?.files?.[0];
  if (file) adminProcessFile(file, tipo);
}

function adminFileSelect(e, tipo) {
  const file = e.target.files?.[0];
  if (file) adminProcessFile(file, tipo);
}

async function adminProcessFile(file, tipo) {
  adminFileMap[tipo] = file;
  document.getElementById('dz-label-' + tipo).textContent = `📄 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
  document.getElementById('apply-status-' + tipo).textContent = 'Generando vista previa…';

  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await api('POST', `/api/admin/preview/${tipo}`, fd, true);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    adminPreviewMap[tipo] = data;
    renderAdminPreview(tipo, data);
    document.getElementById('apply-btn-' + tipo).disabled = false;
    document.getElementById('apply-status-' + tipo).textContent = `${data.total || '?'} registros detectados`;
    addLog(`Vista previa: ${tipo} · ${data.total || '?'} filas`, 'ok');
  } catch (ex) {
    document.getElementById('apply-status-' + tipo).textContent = 'Error: ' + ex.message;
    addLog(`Error al previsualizar ${tipo}: ${ex.message}`, 'err');
    toast('Error al previsualizar: ' + ex.message, 'error');
  }
}

function renderAdminPreview(tipo, data) {
  const el = document.getElementById('preview-' + tipo);
  if (!el || !data.preview?.length) { if (el) el.innerHTML = ''; return; }
  const cols = Object.keys(data.preview[0]);
  el.innerHTML = `
    <div style="margin-bottom:8px;font-size:12px;color:var(--fg2)">Vista previa (primeras ${data.preview.length} filas)</div>
    <div class="table-wrap" style="margin-bottom:8px">
      <div class="table-scroller" style="max-height:220px;overflow-y:auto">
        <table>
          <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${data.preview.map(row =>
            `<tr>${cols.map(c => `<td style="font-size:12px;white-space:nowrap">${row[c] !== undefined ? row[c] : '—'}</td>`).join('')}</tr>`
          ).join('')}</tbody>
        </table>
      </div>
    </div>
  `;
}

async function adminApply(tipo) {
  const file = adminFileMap[tipo];
  if (!file) return;
  const btn = document.getElementById('apply-btn-' + tipo);
  const status = document.getElementById('apply-status-' + tipo);
  btn.disabled = true;
  status.textContent = 'Aplicando…';
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await api('POST', `/api/admin/upload/${tipo}`, fd, true);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    status.textContent = `✅ ${data.registros || '?'} registros cargados`;
    addLog(`Carga exitosa: ${tipo} · ${data.registros || '?'} registros`, 'ok');
    toast(`Carga de ${tipo} exitosa: ${data.registros || '?'} registros`, 'ok');
    await loadAll();
  } catch (ex) {
    status.textContent = 'Error: ' + ex.message;
    addLog(`Error al cargar ${tipo}: ${ex.message}`, 'err');
    toast('Error al cargar: ' + ex.message, 'error');
    btn.disabled = false;
  }
}

function adminClear(tipo) {
  delete adminFileMap[tipo];
  delete adminPreviewMap[tipo];
  document.getElementById('dz-label-' + tipo).textContent = 'Arrastra tu archivo Excel/CSV aquí';
  document.getElementById('preview-' + tipo).innerHTML = '';
  document.getElementById('apply-btn-' + tipo).disabled = true;
  document.getElementById('apply-status-' + tipo).textContent = '';
  const fi = document.getElementById('fi-' + tipo);
  if (fi) fi.value = '';
}

function addLog(msg, type = '') {
  const now = new Date();
  const time = now.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  adminLogs.unshift({ time, msg, type });
  if (adminLogs.length > 50) adminLogs.pop();
  renderActivityLog();
}

function renderActivityLog() {
  const el = document.getElementById('activity-log');
  if (!el) return;
  if (!adminLogs.length) { el.innerHTML = '<div style="color:var(--fg3);font-size:12px;padding:10px">Sin actividad reciente.</div>'; return; }
  el.innerHTML = adminLogs.map(l => `
    <div class="log-item">
      <span class="log-time">${l.time}</span>
      <span class="log-msg ${l.type === 'ok' ? 'log-ok' : l.type === 'err' ? 'log-err' : ''}">${l.msg}</span>
    </div>
  `).join('');
}

/* ═══════════════════════════════════════════════════════════════
   THEME & UI HELPERS
═══════════════════════════════════════════════════════════════ */
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('gl_theme', next);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function showLoading(msg = 'Cargando…') {
  let el = document.getElementById('loading-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'loading-overlay';
    el.className = 'loading-overlay';
    el.innerHTML = `<div class="loading-box"><div class="spinner"></div><span id="loading-msg">${msg}</span></div>`;
    document.body.appendChild(el);
  } else {
    document.getElementById('loading-msg').textContent = msg;
    el.style.display = 'flex';
  }
}

function hideLoading() {
  const el = document.getElementById('loading-overlay');
  if (el) el.style.display = 'none';
}

function toast(msg, type = 'info') {
  const area = document.getElementById('toast-area');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  area.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3500);
}

/* ═══════════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════════ */
(function boot() {
  // Restore theme
  const savedTheme = localStorage.getItem('gl_theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  }
  initApp();
})();
</script>
