<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Logística — INVESAKK SAS</title>
<style>
/* ── CSS TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:       #F1F5F9;
  --surface:  #FFFFFF;
  --border:   #E2E8F0;
  --fg:       #0F172A;
  --fg2:      #475569;
  --fg3:      #94A3B8;
  --accent:   #2563EB;
  --accent-s: #DBEAFE;
  --ok:       #059669;
  --ok-s:     #D1FAE5;
  --warn:     #D97706;
  --warn-s:   #FEF3C7;
  --danger:   #DC2626;
  --danger-s: #FEE2E2;
  --sidebar-w: 220px;
  --radius:   8px;
  --shadow:   0 1px 4px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #0F172A;
    --surface:  #1E293B;
    --border:   #334155;
    --fg:       #F1F5F9;
    --fg2:      #94A3B8;
    --fg3:      #475569;
    --accent:   #3B82F6;
    --accent-s: #1E3A5F;
    --ok:       #10B981;
    --ok-s:     #064E3B;
    --warn:     #F59E0B;
    --warn-s:   #451A03;
    --danger:   #EF4444;
    --danger-s: #450A0A;
    --shadow:   0 1px 4px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg:       #0F172A;
  --surface:  #1E293B;
  --border:   #334155;
  --fg:       #F1F5F9;
  --fg2:      #94A3B8;
  --fg3:      #475569;
  --accent:   #3B82F6;
  --accent-s: #1E3A5F;
  --ok:       #10B981;
  --ok-s:     #064E3B;
  --warn:     #F59E0B;
  --warn-s:   #451A03;
  --danger:   #EF4444;
  --danger-s: #450A0A;
  --shadow:   0 1px 4px rgba(0,0,0,.4);
}

/* ── RESET ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; line-height: 1.5; font-size: 14px; }
button { cursor: pointer; font-family: inherit; font-size: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }
a { color: var(--accent); text-decoration: none; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 12px; }
th { font-weight: 600; color: var(--fg2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); background: var(--bg); }
td { border-bottom: 1px solid var(--border); color: var(--fg); }
tr:last-child td { border-bottom: none; }

/* ── LAYOUT ─────────────────────────────────────────────────── */
#app { display: flex; min-height: 100vh; }
#sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 100; overflow-y: auto;
  transition: transform .25s;
}
#main-area {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex; flex-direction: column;
  min-width: 0;
}
#topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 50;
}
#content { padding: 24px; flex: 1; }

/* ── SIDEBAR ────────────────────────────────────────────────── */
.sb-logo {
  padding: 18px 16px 12px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.sb-logo-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; flex-shrink: 0;
}
.sb-logo-text { font-size: 12px; font-weight: 700; color: var(--fg); line-height: 1.2; }
.sb-logo-sub { font-size: 10px; color: var(--fg2); font-weight: 400; }
.sb-nav { padding: 12px 8px; flex: 1; }
.sb-section { font-size: 10px; font-weight: 700; color: var(--fg3); text-transform: uppercase; letter-spacing: .07em; padding: 8px 8px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 6px;
  cursor: pointer; color: var(--fg2);
  transition: background .15s, color .15s;
  font-size: 13px; font-weight: 500;
  border: none; background: none; width: 100%; text-align: left;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg); color: var(--fg); }
.nav-item.active { background: var(--accent-s); color: var(--accent); }
.nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.sb-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--fg2);
}
.sb-user { font-weight: 600; color: var(--fg); margin-bottom: 2px; }

/* ── TOPBAR ─────────────────────────────────────────────────── */
.topbar-title { font-size: 16px; font-weight: 700; color: var(--fg); flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.btn-icon {
  width: 34px; height: 34px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--fg2); display: flex; align-items: center;
  justify-content: center; font-size: 15px; cursor: pointer;
  transition: background .15s, color .15s;
}
.btn-icon:hover { background: var(--bg); color: var(--fg); }

/* ── PAGES ─────────────────────────────────────────────────── */
.page { display: none; }
.page.active { display: block; }

/* ── LOGIN ─────────────────────────────────────────────────── */
#login-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,.12);
}
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo-icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--accent); color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 22px; margin-bottom: 12px;
}
.login-logo h1 { font-size: 18px; font-weight: 800; }
.login-logo p { font-size: 12px; color: var(--fg2); margin-top: 2px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--fg2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
.form-input {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--fg);
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-s); }
.btn-primary {
  width: 100%; padding: 11px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  font-weight: 700; font-size: 14px;
  cursor: pointer; transition: opacity .15s;
}
.btn-primary:hover { opacity: .9; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
#login-error {
  background: var(--danger-s); color: var(--danger);
  border: 1px solid var(--danger); border-radius: 6px;
  padding: 8px 12px; font-size: 13px; margin-bottom: 16px;
  display: none;
}

/* ── CARDS & KPIS ───────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.kpi-label { font-size: 11px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.kpi-value { font-size: 26px; font-weight: 800; line-height: 1; }
.kpi-sub { font-size: 11px; color: var(--fg3); margin-top: 4px; }
.kpi.ok .kpi-value { color: var(--ok); }
.kpi.warn .kpi-value { color: var(--warn); }
.kpi.danger .kpi-value { color: var(--danger); }
.kpi.accent .kpi-value { color: var(--accent); }

/* ── CHIPS ─────────────────────────────────────────────────── */
.chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
}
.chip-ok { background: var(--ok-s); color: var(--ok); }
.chip-warn { background: var(--warn-s); color: var(--warn); }
.chip-danger { background: var(--danger-s); color: var(--danger); }
.chip-accent { background: var(--accent-s); color: var(--accent); }
.chip-neutral { background: var(--bg); color: var(--fg2); border: 1px solid var(--border); }
.chip-info { background: #E0F2FE; color: #0369A1; }
.chip-purple { background: #EDE9FE; color: #6D28D9; }

/* ── TABLES ─────────────────────────────────────────────────── */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.table-header {
  padding: 14px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.table-title { font-size: 14px; font-weight: 700; flex: 1; }
.search-input {
  padding: 7px 12px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--fg);
  outline: none; width: 200px;
}
.search-input:focus { border-color: var(--accent); }
.form-select {
  padding: 7px 10px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--fg);
  outline: none;
}
.form-select:focus { border-color: var(--accent); }
.table-scroller { overflow-x: auto; }
.table-pagination {
  padding: 10px 16px;
  display: flex; align-items: center; gap: 8px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--fg2);
}
.pag-btn {
  padding: 4px 10px;
  border: 1px solid var(--border); border-radius: 5px;
  background: var(--surface); color: var(--fg);
  cursor: pointer; font-size: 12px;
}
.pag-btn:hover { background: var(--bg); }
.pag-btn:disabled { opacity: .4; cursor: not-allowed; }
.pag-info { flex: 1; }

/* ── PROGRESS BARS ─────────────────────────────────────────── */
.progress-bar {
  height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
  margin-top: 4px;
}
.progress-fill { height: 100%; border-radius: 3px; transition: width .4s; }

/* ── STACKED BAR ────────────────────────────────────────────── */
.stack-bar {
  display: flex; height: 18px; border-radius: 4px; overflow: hidden; margin-top: 6px;
}
.stack-seg { height: 100%; transition: width .4s; }

/* ── PROFILE CARD ───────────────────────────────────────────── */
.profile-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.profile-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; flex-shrink: 0;
}
.profile-info h2 { font-size: 18px; font-weight: 800; }
.profile-info p { color: var(--fg2); font-size: 13px; }
.profile-meta { margin-top: 6px; display: flex; gap: 16px; font-size: 12px; color: var(--fg2); flex-wrap: wrap; }
.profile-meta span::before { content: ''; }

/* ── SVG CHART ──────────────────────────────────────────────── */
.chart-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.chart-label { font-size: 12px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
svg text { font-family: system-ui, sans-serif; }

/* ── PILLS ─────────────────────────────────────────────────── */
.pill-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.pill {
  padding: 5px 14px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--fg2);
  cursor: pointer; font-size: 12px; font-weight: 600;
  transition: all .15s;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── ADMIN ──────────────────────────────────────────────────── */
.tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab-btn {
  padding: 10px 18px;
  border: none; background: none;
  color: var(--fg2); font-weight: 600; font-size: 13px;
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.tab-btn:hover { color: var(--fg); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.col-chip { display:inline-block; padding:2px 8px; border-radius:4px; background:var(--accent-s); color:var(--accent); font-size:11px; font-family:monospace; font-weight:600; margin:2px 2px 2px 0; }
.col-chip.opt { background:var(--border); color:var(--fg3); }
.schema-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--fg2);
  margin-bottom: 14px;
  font-family: monospace;
  line-height: 1.8;
}
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  color: var(--fg2);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  margin-bottom: 14px;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-s); color: var(--accent); }
.drop-zone-icon { font-size: 28px; margin-bottom: 8px; }
.drop-zone-text { font-size: 13px; font-weight: 600; }
.drop-zone-sub { font-size: 11px; margin-top: 4px; }

.btn-secondary {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 6px; background: var(--surface);
  color: var(--fg); font-weight: 600; font-size: 13px;
  cursor: pointer; transition: background .15s;
}
.btn-secondary:hover { background: var(--bg); }
.btn-success {
  padding: 8px 16px;
  border: none; border-radius: 6px;
  background: var(--ok); color: #fff;
  font-weight: 700; font-size: 13px;
  cursor: pointer; transition: opacity .15s;
}
.btn-success:hover { opacity: .9; }
.btn-success:disabled { opacity: .4; cursor: not-allowed; }

.activity-log {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  max-height: 240px; overflow-y: auto;
}
.log-item {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--fg2);
  display: flex; gap: 8px;
}
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--fg3); flex-shrink: 0; }
.log-msg { flex: 1; }
.log-ok { color: var(--ok); }
.log-err { color: var(--danger); }

/* ── CONDUCTOR COLORS ────────────────────────────────────────── */
.cond-ROA { color: #1D4ED8; }
.cond-MARTINEZ { color: #7C3AED; }
.cond-MARIN { color: #059669; }
.cond-MENDOZA { color: #D97706; }
.cond-NINO, .cond-NIÑO { color: #DC2626; }

.dot-ROA { background: #1D4ED8; }
.dot-MARTINEZ { background: #7C3AED; }
.dot-MARIN { background: #059669; }
.dot-MENDOZA { background: #D97706; }
.dot-NINO, .dot-NIÑO { background: #DC2626; }

/* ── RESUMEN CARDS ───────────────────────────────────────────── */
.conductor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.conductor-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.conductor-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cond-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.conductor-card-name { font-weight: 700; font-size: 15px; }
.conductor-card-placa { font-size: 11px; color: var(--fg2); }
.cond-stat-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg2); margin-bottom: 4px; }

/* ── LOADING ────────────────────────────────────────────────── */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center;
  z-index: 8000;
}
.loading-box {
  background: var(--surface);
  border-radius: 12px; padding: 24px 32px;
  display: flex; align-items: center; gap: 14px;
  font-weight: 600; box-shadow: 0 8px 32px rgba(0,0,0,.2);
}

/* ── SECTION HEADER ─────────────────────────────────────────── */
.section-header { margin-bottom: 16px; }
.section-header h2 { font-size: 18px; font-weight: 800; }
.section-header p { color: var(--fg2); font-size: 13px; margin-top: 2px; }

/* ── SUMMARY BOXES ─────────────────────────────────────────── */
.summary-boxes {
  display: flex; gap: 10px; flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.sum-box { text-align: center; padding: 0 14px; }
.sum-box + .sum-box { border-left: 1px solid var(--border); }
.sum-label { font-size: 10px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .05em; }
.sum-value { font-size: 20px; font-weight: 800; color: var(--fg); }
.sum-value.ok { color: var(--ok); }
.sum-value.warn { color: var(--warn); }
.sum-value.danger { color: var(--danger); }
.sum-value.accent { color: var(--accent); }

/* ── TOAST ──────────────────────────────────────────────────── */
#toast-area {
  position: fixed; bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 99999;
}
.toast {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
  font-size: 13px; max-width: 320px;
  animation: slideIn .25s ease;
}
.toast.ok { border-left: 4px solid var(--ok); }
.toast.error { border-left: 4px solid var(--danger); }
.toast.info { border-left: 4px solid var(--accent); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ── GPS TABLE ──────────────────────────────────────────────── */
.vel-high { color: var(--danger); font-weight: 700; }
.acc-chip { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.acc-on { background: var(--ok); }
.acc-off { background: var(--fg3); }

/* ── RESPONSIVE ─────────────────────────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 0px; }
  #sidebar { transform: translateX(-220px); width: 220px; }
  #sidebar.open { transform: translateX(0); }
  #main-area { margin-left: 0; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .conductor-grid { grid-template-columns: 1fr; }
  .summary-boxes { flex-wrap: wrap; }
  .sum-box + .sum-box { border-left: none; border-top: 1px solid var(--border); padding-top: 8px; }
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">GL</div>
      <h1>Gestión Logística</h1>
      <p>INVESAKK SAS · NIT 802014471-6</p>
    </div>
    <div id="login-error"></div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-user">Usuario</label>
        <input class="form-input" id="login-user" type="text" placeholder="usuario" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="login-pass">Contraseña</label>
        <input class="form-input" id="login-pass" type="password" placeholder="••••••" autocomplete="current-password" required>
      </div>
      <button class="btn-primary" type="submit" id="login-btn">Iniciar sesión</button>
    </form>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" style="display:none">
  <!-- SIDEBAR -->

      <div class="page" id="page-gps"></div>

<!-- TOAST AREA -->
<div id="toast-area"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let session = null;
let conductores = [];
let facturas = [];
let meses = [];
let gpsData = [];
let stats = {};   // stats calculadas del mes activo: { ROA:{pedidos,bono_c,...}, ... }

// Devuelve stats del mes para un conductor — prioriza stats calculadas sobre seed
function getCondStats(clave) {
  const s = stats[clave] || {};
  const c = conductores.find(x => x.clave === clave) || {};
  return {
    ...c,
    pedidos:   s.pedidos   ?? c.pedidos   ?? 0,
    a_tiempo:  s.pct_tiempo ?? c.a_tiempo  ?? 0,
    h24:       s.h24        ?? c.h24       ?? 0,
    d2:        s.d2         ?? c.d2        ?? 0,
    bono_c:    Number(s.bono_c     ?? c.bono_c    ?? 0),
    bono_a:    Number(s.bono_a     ?? c.bono_a    ?? 0),
    entregadas: s.entregadas ?? 0,
    pendientes: s.pendientes ?? 0,
    notas_traslado: s.notas_traslado ?? 0,
    peso_total: Number(s.peso_total ?? 0),
  };
}
let bodegasData = [];
let mesActivo = (() => {
  const now = new Date();
  return now.toISOString().slice(0, 7);
})();
let activePage = '';
let adminLogs = [];

const COND_COLORS = {
  ROA: '#1D4ED8', MARTINEZ: '#7C3AED', MARIN: '#059669',
  MENDOZA: '#D97706', 'NIÑO': '#DC2626', NINO: '#DC2626'
};

/* ═══════════════════════════════════════════════════════════════
   BUSINESS LOGIC
═══════════════════════════════════════════════════════════════ */
function getDias(f) {
  if (f.dif_dias !== undefined && f.dif_dias !== null) return f.dif_dias;
  const base = f.fec_promesa || f.fec_fact;
  if (!base || !f.fec_entr) return null;
  const d1 = new Date(base); const d2 = new Date(f.fec_entr);
  return Math.round((d2 - d1) / 86400000);
}

function calcBono(dh, esMT) {
  if (esMT || esMT === null) return 0;
  if (dh === null || dh === undefined) return 0;
  if (dh <= 0) return 6000;
  if (dh <= 1) return 6000;
  if (dh <= 2) return 5000;
  if (dh <= 5) return 4000;
  if (dh <= 10) return -400;
  if (dh <= 20) return -800;
  return -2000;
}

function tipoEsMT(tipo) {
  return tipo && tipo.startsWith('NT');
}

function tipoChip(tipo) {
  if (!tipo) return `<span class="chip chip-neutral">—</span>`;
  if (tipo.startsWith('NT')) return `<span class="chip chip-neutral">${tipo}</span>`;
  if (tipo === 'FEPA') return `<span class="chip chip-info">${tipo}</span>`;
  if (tipo === 'G1AG') return `<span class="chip chip-purple">${tipo}</span>`;
  return `<span class="chip chip-neutral">${tipo}</span>`;
}

function bonoColor(val) {
  if (val > 0) return 'ok';
  if (val < 0) return 'danger';
  return 'neutral';
}

function fmtCurrency(v) {
  if (v === null || v === undefined) return '—';
  return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(v);
}

function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s.slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return s.slice(0, 10);
  return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: undefined });
}

function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString('es-CO');
}

function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

/* ═══════════════════════════════════════════════════════════════
   API HELPER
   API_BASE_URL: vacío = mismo servidor (Render monolítico)
                 URL   = backend externo (Render) desde Vercel
═══════════════════════════════════════════════════════════════ */
const API_BASE_URL = (typeof __API_BASE_URL__ !== 'undefined' && __API_BASE_URL__)
  ? __API_BASE_URL__
  : '';

async function api(method, url, body = null, isFile = false) {
  const token = localStorage.getItem('gl_token');
  const fullUrl = API_BASE_URL + url;
  const opts = { method, headers: token ? { 'Authorization': `Bearer ${token}` } : {} };
  if (body && !isFile) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  } else if (body && isFile) {
    opts.body = body;
  }
  return fetch(fullUrl, opts);
}

/* ═══════════════════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════════════════ */
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = 'Verificando…';
  err.style.display = 'none';
  try {
    const res = await api('POST', '/api/auth/login', {
      usuario: document.getElementById('login-user').value.trim(),
      password: document.getElementById('login-pass').value
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.msg || data.error || 'Credenciales inválidas');
    }
    const data = await res.json();
    localStorage.setItem('gl_token', data.token);
    session = data.user;
    session.token = data.token;
    document.getElementById('login-screen').style.display = 'none';
    await loadAll();
    buildApp();
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
  }
}

function logout() {
  localStorage.removeItem('gl_token');
  session = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pass').value = '';
}

/* ═══════════════════════════════════════════════════════════════
   DATA LOADERS
═══════════════════════════════════════════════════════════════ */
async function loadConductores() {
  try {
    const res = await api('GET', '/api/conductores');
    if (res.ok) conductores = await res.json();
  } catch (_) {}
}

async function loadFacturas() {
  try {
    let url = `/api/facturas?mes=${mesActivo}`;
    if (session?.role === 'conductor' && session?.cond_key) {
      url += `&conductor=${encodeURIComponent(session.cond_key)}`;
    }
    const res = await api('GET', url);
    if (res.ok) {
      const data = await res.json();
      facturas = data.facturas || [];
      meses = data.meses || [];
    }
  } catch (_) {}
}

async function loadStats() {
  try {
    const url = `/api/stats?mes=${mesActivo}`;
    const res = await api('GET', url);
    if (res.ok) stats = await res.json();
  } catch (_) {}
}

async function loadGps() {
  try {
    const res = await api('GET', '/api/gps');
    if (res.ok) gpsData = await res.json();
  } catch (_) {}
}

async function loadBodegas() {
  try {
    const res = await api('GET', '/api/bodegas');
    if (res.ok) bodegasData = await res.json();
  } catch (_) {}
}

async function loadAll() {
  showLoading('Cargando datos…');
  await Promise.all([loadConductores(), loadGps(), loadBodegas()]);
  await loadFacturas();
  await loadStats();
  hideLoading();
}

async function refreshAll() {
  await loadAll();
  renderActivePage();
  toast('Datos actualizados', 'ok');
}

/* ═══════════════════════════════════════════════════════════════
   APP INIT
═══════════════════════════════════════════════════════════════ */
async function initApp() {
  const token = localStorage.getItem('gl_token');
  if (!token) { showLogin(); return; }
  try {
    const res = await api('GET', '/api/auth/me');
    if (!res.ok) { showLogin(); return; }
    session = await res.json();
    session.token = token;
    document.getElementById('login-screen').style.display = 'none';
    await loadAll();
    buildApp();
  } catch (_) {
    showLogin();
  }
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function buildApp() {
  document.getElementById('app').style.display = 'flex';
  document.getElementById('sb-user-name').textContent = session.nombre || session.usuario;
  document.getElementById('sb-user-role').textContent = session.cargo || session.role;
  buildSidebar();
  const pages = getPagesForRole(session.role);
  if (pages.length) navigateTo(pages[0].id);
}

function getPagesForRole(role) {
  const all = [
    { id: 'admin',         label: 'Administración', icon: '⚙️' },
    { id: 'resumen',       label: 'Resumen',         icon: '📊' },
    { id: 'equipo',        label: 'Equipo',          icon: '👥' },
    { id: 'facturas-jefe', label: 'Facturas',        icon: '📄' },
    { id: 'gps',           label: 'GPS',             icon: '📍' },
    { id: 'pendientes',    label: 'Pendientes',      icon: '📦' },
    { id: 'mi-panel',      label: 'Mi Panel',        icon: '🏠' },
    { id: 'ayudante',      label: 'Mi Panel',        icon: '🏠' },
  ];
  const roleMap = {
    admin:      ['admin','resumen','equipo','facturas-jefe','gps','pendientes'],
    jefe:       ['resumen','equipo','facturas-jefe','gps','pendientes'],
    'aux-jefe': ['equipo','gps','pendientes'],
    conductor:  ['mi-panel'],
    ayudante:   ['ayudante'],
  };
  const allowed = roleMap[role] || [];
  return all.filter(p => allowed.includes(p.id));
}

function buildSidebar() {
  const nav = document.getElementById('sb-nav');
  const pages = getPagesForRole(session.role);
  nav.innerHTML = pages.map(p => `
    <button class="nav-item" data-page="${p.id}" onclick="navigateTo('${p.id}')">
      <span class="nav-icon">${p.icon}</span>
      <span>${p.label}</span>
    </button>
  `).join('');
}

function navigateTo(pageId) {
  activePage = pageId;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === pageId);
  });
  const el = document.getElementById('page-' + pageId);
  if (el) el.classList.add('active');
  renderActivePage();
  // Close sidebar on mobile
  if (window.innerWidth < 768) document.getElementById('sidebar').classList.remove('open');
}

function renderActivePage() {
  const titles = {
    'resumen': 'Resumen General', 'equipo': 'Equipo de Conductores',
    'facturas-jefe': 'Facturas', 'gps': 'GPS en Tiempo Real',
    'pendientes': 'Pedidos Pendientes', 'admin': 'Administración',
    'mi-panel': 'Mi Panel', 'ayudante': 'Mi Panel'
  };
  document.getElementById('topbar-title').textContent = titles[activePage] || '';
  switch (activePage) {
    case 'resumen':       renderResumen(); break;
    case 'equipo':        renderEquipo(); break;
    case 'mi-panel':      renderMiPanel(); break;
    case 'ayudante':      renderAyudante(); break;
    case 'facturas-jefe': renderFacturasJefe(); break;
    case 'gps':           renderGps(); break;
    case 'pendientes':    renderPendientes(); break;
    case 'admin':         renderAdmin(); break;
  }
}

/* ═══════════════════════════════════════════════════════════════
   PAGE: RESUMEN
═══════════════════════════════════════════════════════════════ */
// Constantes del bono de jefatura (según slide 9 del informe)
const BONO_JEFE_META   = 0.85;   // 85% a tiempo para activar
const BONO_JEFE        = 800000;
const BONO_AUX1        = 200000;
const BONO_AUX2        = 200000;
const BONO_EXTRA_COND  = 350000; // extra por conductor si alcanza 85%
const BONO_EXTRA_AYUD  = 175000;

function calcBonoJefatura(totalEnt) {
  // Usar el conteo real de a_tiempo desde stats (no el porcentaje ya calculado)
  const totalATiempo = conductores.reduce((s, c) => s + (stats[c.clave]?.a_tiempo || 0), 0);
  const pct = totalEnt > 0 ? totalATiempo / totalEnt : 0;
  const activado = pct >= BONO_JEFE_META;
  return { pct: Math.round(pct * 100), activado, totalATiempo };
}

function renderResumen() {
  const el = document.getElementById('page-resumen');
  const allStats = conductores.map(c => getCondStats(c.clave));
  const totalPed  = allStats.reduce((s, c) => s + (c.pedidos || 0), 0);
  const totalBono = allStats.reduce((s, c) => s + (c.bono_c || 0) + (c.bono_a || 0), 0);
  const totalEnt   = allStats.reduce((s, c) => s + (c.entregadas || 0), 0);
  const totalPend  = allStats.reduce((s, c) => s + (c.pendientes || 0), 0);
  const totalATiempo = conductores.reduce((s, c) => s + (stats[c.clave]?.a_tiempo || 0), 0);
  const totalTarde   = totalEnt - totalATiempo;
  const totalPeso    = allStats.reduce((s, c) => s + (c.peso_total || 0), 0);

  const bj = calcBonoJefatura(totalEnt);
  const metaPct = Math.round(BONO_JEFE_META * 100);
  const faltaPct = Math.max(0, metaPct - bj.pct);
  const barColor = bj.pct >= 85 ? '#059669'
                 : bj.pct >= 70 ? '#22C55E'
                 : bj.pct >= 55 ? '#F59E0B'
                 : bj.pct >= 40 ? '#F97316'
                 : '#EF4444';
  const barW = Math.min(100, bj.pct);

  // Tabla de conductores con extra si alcanzan 85%
  const condExtraRows = conductores.map(c => {
    const s = getCondStats(c.clave);
    // pct_tiempo ya viene calculado del backend como porcentaje directo
    const condPct = stats[c.clave]?.pct_tiempo ?? 0;
    const extra = condPct >= metaPct;
    return `<tr>
      <td style="font-weight:600;color:${COND_COLORS[c.clave]||'var(--fg)'}">${c.short || c.clave}</td>
      <td style="text-align:right">${s.entregadas||0}</td>
      <td style="text-align:right">${condPct}%</td>
      <td style="text-align:right;font-weight:700;color:${extra?'#059669':'var(--fg2)'}">
        ${extra ? '+' + fmtCurrency(BONO_EXTRA_COND) : '—'}
      </td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="section-header">
      <h2>Resumen General</h2>
      <p>Vista consolidada del equipo de reparto · ${mesActivo}</p>
    </div>

    <!-- KPIs globales -->
    <div class="kpi-grid" style="margin-bottom:20px">
      <div class="kpi accent"><div class="kpi-label">Conductores</div><div class="kpi-value">${conductores.length}</div></div>
      <div class="kpi"><div class="kpi-label">Pedidos entregados</div><div class="kpi-value">${fmtNum(totalEnt)}</div></div>
      <div class="kpi ok"><div class="kpi-label">A tiempo (≤5d)</div><div class="kpi-value">${fmtNum(totalATiempo)}</div></div>
      <div class="kpi danger"><div class="kpi-label">Tarde (&gt;5d)</div><div class="kpi-value">${fmtNum(Math.max(0,totalTarde))}</div></div>
      <div class="kpi warn"><div class="kpi-label">Pendientes</div><div class="kpi-value">${fmtNum(totalPend)}</div></div>
      <div class="kpi accent"><div class="kpi-label">Peso total (kg)</div><div class="kpi-value">${Math.round(totalPeso).toLocaleString('es-CO')}</div></div>
      <div class="kpi ${totalBono >= 0 ? 'ok' : 'danger'}"><div class="kpi-label">Bono Neto Equipo</div><div class="kpi-value">${fmtCurrency(totalBono)}</div></div>
    </div>

    <!-- Bono de jefatura -->
    <div class="chart-wrap" style="margin-bottom:20px">
      <div class="chart-label">Bono de Jefatura por Cumplimiento</div>
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <span style="font-size:13px;color:var(--fg2)">Cumplimiento global a tiempo</span>
          <span style="font-size:22px;font-weight:800;color:${barColor}">${bj.pct}%</span>
        </div>
        <div style="background:var(--border);border-radius:8px;height:14px;overflow:hidden;position:relative">
          <div style="width:${barW}%;height:100%;background:${barColor};border-radius:8px;transition:width .4s"></div>
          <div style="position:absolute;top:0;left:${metaPct}%;width:2px;height:100%;background:var(--fg);opacity:.4"></div>
        </div>
        <!-- Leyenda semáforo -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:10px">
          ${[
            {min:0,  max:40, color:'#EF4444', label:'Crítico (0–40%)'},
            {min:40, max:55, color:'#F97316', label:'Bajo (40–55%)'},
            {min:55, max:70, color:'#F59E0B', label:'Regular (55–70%)'},
            {min:70, max:85, color:'#22C55E', label:'Cerca (70–85%)'},
            {min:85, max:100,color:'#059669', label:'Meta alcanzada (≥85%)'},
          ].map(z => {
            const active = bj.pct >= z.min && (z.max===100 ? bj.pct>=z.min : bj.pct < z.max);
            return `<span style="display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;
              background:${active ? z.color+'22' : 'transparent'};
              border:1.5px solid ${active ? z.color : 'var(--border)'};
              color:${active ? z.color : 'var(--fg2)'};
              font-weight:${active ? '700' : '400'}">
              <span style="width:8px;height:8px;border-radius:50%;background:${z.color};display:inline-block;flex-shrink:0"></span>
              ${z.label}
            </span>`;
          }).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--fg2);margin-top:4px">
          <span>0%</span>
          <span style="color:var(--fg);font-weight:600">Meta: ${metaPct}%</span>
          <span>100%</span>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <!-- Estado del bono -->
        <div style="background:${bj.activado?'#DCFCE7':'#FEF2F2'};border:1px solid ${bj.activado?'#86EFAC':'#FCA5A5'};border-radius:10px;padding:12px 14px">
          <div style="font-size:11px;font-weight:700;color:${bj.activado?'#059669':'#DC2626'};margin-bottom:6px">
            ${bj.activado ? '✓ BONO ACTIVADO' : '✗ BONO NO ACTIVADO'}
          </div>
          <div style="font-size:11px;color:var(--fg2)">${bj.activado ? 'Se cumplió la meta del ' + metaPct + '%' : 'Faltan ' + faltaPct + ' p.p. para la meta'}</div>
        </div>
        <!-- Distribución del bono -->
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px">
          <div style="font-size:11px;font-weight:700;color:var(--fg);margin-bottom:6px">Distribución si se activa</div>
          <div style="font-size:11px;color:var(--fg2);display:flex;flex-direction:column;gap:3px">
            <div style="display:flex;justify-content:space-between"><span>Jefe de logística</span><strong style="color:${bj.activado?'#059669':'var(--fg2)'}">${fmtCurrency(BONO_JEFE)}</strong></div>
            <div style="display:flex;justify-content:space-between"><span>Auxiliar (Landero)</span><strong style="color:${bj.activado?'#059669':'var(--fg2)'}">${fmtCurrency(BONO_AUX1)}</strong></div>
            <div style="display:flex;justify-content:space-between"><span>Auxiliar (2.º)</span><strong style="color:${bj.activado?'#059669':'var(--fg2)'}">${fmtCurrency(BONO_AUX2)}</strong></div>
          </div>
        </div>
      </div>

      <!-- Extra por conductor que alcance 85% -->
      <div style="font-size:11px;font-weight:700;color:var(--fg);margin-bottom:6px">Extra por conductor al alcanzar ${metaPct}% — +${fmtCurrency(BONO_EXTRA_COND)} c. / +${fmtCurrency(BONO_EXTRA_AYUD)} ay.</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="border-bottom:1px solid var(--border)">
          <th style="text-align:left;padding:4px 6px;color:var(--fg2);font-weight:600">Conductor</th>
          <th style="text-align:right;padding:4px 6px;color:var(--fg2);font-weight:600">Entregadas</th>
          <th style="text-align:right;padding:4px 6px;color:var(--fg2);font-weight:600">% A tiempo</th>
          <th style="text-align:right;padding:4px 6px;color:var(--fg2);font-weight:600">Extra</th>
        </tr></thead>
        <tbody>${condExtraRows}</tbody>
      </table>
    </div>

    <!-- Bono neto total del equipo -->
    <div class="chart-wrap" style="margin-bottom:20px">
      <div class="chart-label">Bono Neto Total del Equipo</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px">
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px">

      ${(() => {
        const totalExtraCond = conductores.reduce((s,c)=>{ const pct=stats[c.clave]?.pct_tiempo??0; return s+(pct>=metaPct?BONO_EXTRA_COND:0); },0);
        const totalExtraAyud = conductores.reduce((s,c)=>{ const pct=stats[c.clave]?.pct_tiempo??0; return s+(pct>=metaPct?BONO_EXTRA_AYUD:0); },0);
        const totalCondBono  = allStats.reduce((s,c)=>s+Number(c.bono_c||0),0);
        const totalAyudBono  = allStats.reduce((s,c)=>s+Number(c.bono_a||0),0);
        const totalJefatura  = bj.activado ? BONO_JEFE + BONO_AUX1 + BONO_AUX2 : 0;
        const grandTotal     = totalCondBono + totalAyudBono + totalExtraCond + totalExtraAyud + totalJefatura;
        const th = (t,r='right') => `<th style="text-align:${r};padding:5px 8px;color:var(--fg2);font-weight:600">${t}</th>`;
        const td = (v,color='var(--fg)',bold=false,r='right') =>
          `<td style="padding:6px 8px;text-align:${r};color:${color};font-weight:${bold?'700':'400'}">${v}</td>`;
        const condRows = conductores.map(c => {
          const s = getCondStats(c.clave);
          const condPct = stats[c.clave]?.pct_tiempo ?? 0;
          const exC = condPct >= metaPct ? BONO_EXTRA_COND : 0;
          const tot = Number(s.bono_c||0) + exC;
          const clr = tot >= 0 ? '#059669' : '#DC2626';
          return `<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:6px 8px;font-weight:600;color:${COND_COLORS[c.clave]||'var(--fg)'}">${c.nombre || c.clave}</td>
            ${td(fmtCurrency(s.bono_c||0),(s.bono_c||0)>=0?'#059669':'#DC2626',true)}
            ${td(exC>0?'+'+fmtCurrency(exC):'—',exC>0?'#059669':'var(--fg2)',true)}
            ${td(fmtCurrency(tot),clr,true)}
          </tr>`;
        }).join('');
        const jefaturaRows = bj.activado ? `
          <tr style="border-bottom:1px solid var(--border);background:rgba(5,150,105,.04)">
            <td style="padding:6px 8px;font-weight:600;color:#0369A1">Jefe de Logística</td>
            ${td('—','var(--fg2)')} ${td('—','var(--fg2)')}
            ${td(fmtCurrency(BONO_JEFE),'#059669',true)}
          </tr>
          <tr style="border-bottom:1px solid var(--border);background:rgba(5,150,105,.04)">
            <td style="padding:6px 8px;font-weight:600;color:#0369A1">Auxiliar Jefatura 1</td>
            ${td('—','var(--fg2)')} ${td('—','var(--fg2)')}
            ${td(fmtCurrency(BONO_AUX1),'#059669',true)}
          </tr>
          <tr style="border-bottom:1px solid var(--border);background:rgba(5,150,105,.04)">
            <td style="padding:6px 8px;font-weight:600;color:#0369A1">Auxiliar Jefatura 2</td>
            ${td('—','var(--fg2)')} ${td('—','var(--fg2)')}
            ${td(fmtCurrency(BONO_AUX2),'#059669',true)}
          </tr>` : '';
        const grandTotalCond = totalCondBono + totalExtraCond;
        return `<table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="border-bottom:1px solid var(--border)">
            ${th('Persona','left')}${th('Bono Cond.')}${th('Extra Cond. 85%')}${th('Total')}

            ${jefaturaRows}

        const grandTotal = totalAyud + totalExtra;
        return `<table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="border-bottom:1px solid var(--border)">
            ${th('Auxiliar','left')}${th('Bono Ayud.')}${th('Extra 85%')}${th('Total')}

    </div>

      </div>
      <div class="chart-wrap">
        <div class="chart-label">Cumplimiento</div>
        <div style="font-size:11px;color:var(--fg2);margin-bottom:12px">% entregas a tiempo por conductor</div>
        <div id="res-cumplimiento"></div>
      </div>
    </div>

    <!-- Gráfica entregas por día -->
    <div class="chart-wrap" style="margin-bottom:20px">
      <div class="chart-label">Cantidad de entregas por día — Equipo completo</div>

    </div>

    <!-- Top destinos -->

      <div class="chart-label">Top destinos — ${mesActivo}</div>

  // Gráfica Total vs A tiempo por conductor (barras lado a lado)
  (function() {
    const el = document.getElementById('res-cond-bar-chart');
    if (!el || !conductores.length) return;
    const W = 600, H = 160, padL = 32, padR = 12, padT = 22, padB = 36;
    const chartW = W - padL - padR, chartH = H - padT - padB;
    const data = conductores.map(c => {
      const rs = stats[c.clave] || {};
      const ok    = rs.a_tiempo   || 0;
      const ent   = rs.entregadas || 0;
      const tarde = Math.max(0, ent - ok);
      const peso  = Number(rs.peso_total || 0);
      return { label: c.short || c.clave, ok, tarde, total: ent, peso };
    });
    const maxVal = Math.max(...data.map(d => d.total), 1);
    const slotW  = chartW / data.length;
    const gap    = 2;
    const barW   = Math.max(8, Math.min(20, (slotW - gap * 4) / 3));
    const yBase  = padT + chartH;
    const legend = `<text x="${padL}" y="12" font-size="9" fill="#64748B">■ <tspan fill="#1e3a5f">Total</tspan>   ■ <tspan fill="#10B981">A tiempo</tspan>   ■ <tspan fill="#EF4444">Tarde</tspan></text>`;
    const bars = data.map((d, i) => {
      const cx  = padL + i * slotW + slotW / 2;
      const x1  = cx - barW * 1.5 - gap;
      const x2  = cx - barW / 2;
      const x3  = cx + barW / 2 + gap;
      const tH  = Math.max(d.total > 0 ? 2 : 0, Math.round((d.total / maxVal) * chartH));
      const oH  = Math.max(d.ok    > 0 ? 2 : 0, Math.round((d.ok    / maxVal) * chartH));
      const rdH = Math.max(d.tarde > 0 ? 2 : 0, Math.round((d.tarde / maxVal) * chartH));
      const pesoStr = d.peso >= 1000 ? (d.peso/1000).toFixed(1)+'t' : Math.round(d.peso)+'kg';
      return `
        <rect x="${x1.toFixed(1)}" y="${yBase-tH}"  width="${barW}" height="${tH}"  fill="#1e3a5f" rx="2"/>
        <text x="${(x1+barW/2).toFixed(1)}" y="${yBase-tH-3}"  text-anchor="middle" font-size="9" fill="var(--fg2)">${d.total}</text>
        <rect x="${x2.toFixed(1)}" y="${yBase-oH}"  width="${barW}" height="${oH}"  fill="#10B981" rx="2"/>
        <text x="${(x2+barW/2).toFixed(1)}" y="${yBase-oH-3}"  text-anchor="middle" font-size="9" fill="#10B981">${d.ok}</text>
        <rect x="${x3.toFixed(1)}" y="${yBase-rdH}" width="${barW}" height="${rdH}" fill="#EF4444" rx="2"/>
        <text x="${(x3+barW/2).toFixed(1)}" y="${yBase-rdH-3}" text-anchor="middle" font-size="9" fill="#EF4444">${d.tarde}</text>
        <text x="${cx}" y="${yBase+13}" text-anchor="middle" font-size="10" fill="var(--fg2)">${d.label}</text>
        <text x="${cx}" y="${yBase+24}" text-anchor="middle" font-size="9"  fill="#0369A1">${pesoStr}</text>`;
    }).join('');
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H+10}" style="width:100%;max-width:${W}px;height:auto;display:block">${legend}${bars}</svg>`;
  })();

  // Cumplimiento por conductor (barras de progreso)
  (function() {
    const el = document.getElementById('res-cumplimiento');
    if (!el) return;
    const rows = conductores.map(c => {
      const s = getCondStats(c.clave);
      const pct = stats[c.clave]?.pct_tiempo ?? 0;
      const ent = s.entregadas || 0;
      const ok  = s.a_tiempo  || 0;
      const color = pct >= 85 ? '#059669' : pct >= 55 ? '#F59E0B' : '#EF4444';
      return `<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <span style="font-weight:700;color:${COND_COLORS[c.clave]||'var(--fg)'}">${c.short || c.clave}</span>
          <span style="font-weight:800;color:${color};font-size:15px">${pct}%</span>
        </div>
        <div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden">
          <div style="width:${Math.min(100,pct)}%;height:100%;background:${color};border-radius:4px;transition:width .4s"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;font-size:10px;color:var(--fg2);margin-top:3px">
          <span style="color:#0369A1;font-weight:600">${(s.peso_total||0).toLocaleString('es-CO')} kg</span>
        </div>
      </div>`;
    }).join('');
    el.innerHTML = rows || '<p style="color:var(--fg2);font-size:12px">Sin datos</p>';
  })();

  // Gráfica diaria global
  renderDailyChart(facturas, '#64748B', 'res-daily-chart');

  // Top destinos
  (function() {
    const el = document.getElementById('res-top-destinos');
    if (!el) return;
    const count = {};
    facturas.forEach(f => {
      if (!f.ciudad) return;
      const c = f.ciudad.trim();
      count[c] = (count[c] || 0) + 1;
    });
    const total = facturas.length || 1;
    const sorted = Object.entries(count).sort((a,b) => b[1]-a[1]).slice(0, 8);
    const maxVal = sorted[0]?.[1] || 1;
    const rows = sorted.map(([ciudad, n]) => {
      const pct = Math.round(n / total * 100);
      return `<tr>
        <td style="font-weight:600;padding:8px 12px">${ciudad}</td>
        <td style="text-align:right;font-weight:700;padding:8px 12px">${n}</td>
        <td style="padding:8px 12px">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;background:var(--border);border-radius:4px;height:8px;overflow:hidden">
              <div style="width:${Math.round(n/maxVal*100)}%;height:100%;background:var(--accent);border-radius:4px"></div>
            </div>
            <span style="font-weight:700;color:var(--accent);min-width:34px;text-align:right">${pct}%</span>
          </div>
        </td>
      </tr>`;
    }).join('');
    el.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr>
        <th style="text-align:left;padding:5px 12px;color:var(--fg2);font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)">Ciudad</th>
        <th style="text-align:right;padding:5px 12px;color:var(--fg2);font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)">Entregas</th>
        <th style="text-align:left;padding:5px 12px;color:var(--fg2);font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)">Participación</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  })();

  // Renderizar categorías globales usando todas las facturas
  renderStackChartEl(facturas, document.getElementById('res-stack-chart'));

  const grid = el.querySelector('#res-cards');
  grid.innerHTML = conductores.map(c => {
    const s = getCondStats(c.clave);
    const color = COND_COLORS[c.clave] || '#64748B';
    const bono = (s.bono_c || 0) + (s.bono_a || 0);
    const bonoCls = bono > 0 ? 'ok' : bono < 0 ? 'danger' : '';
    const myFacts = facturas.filter(f => f.cond_key === c.clave);
    return `
      <div class="conductor-card" style="cursor:pointer" onclick="">
        <div class="conductor-card-header">
          <div class="cond-dot" style="background:${color}"></div>
          <div style="flex:1">
            <div class="conductor-card-name">${c.nombre || c.clave}</div>
            <div class="conductor-card-placa">${c.placa || '—'} · ${c.short || c.clave}</div>
          </div>
        </div>
        <div style="margin:10px 0 6px">
          <div id="res-cat-${c.clave}"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
          <div style="background:var(--bg);border-radius:6px;padding:6px 8px;border:1px solid var(--border)">
            <div style="font-size:10px;color:var(--fg2)">Pedidos</div>
            <div style="font-size:18px;font-weight:800;color:var(--fg)">${s.pedidos || 0}</div>
          </div>
          <div style="background:var(--bg);border-radius:6px;padding:6px 8px;border:1px solid var(--border)">
            <div style="font-size:10px;color:var(--fg2)">A tiempo</div>
            <div style="font-size:18px;font-weight:800;color:#059669">${s.a_tiempo !== undefined ? s.a_tiempo + '%' : '—'}</div>
          </div>
          <div style="background:var(--bg);border-radius:6px;padding:6px 8px;border:1px solid var(--border);grid-column:1/-1">
            <div style="font-size:10px;color:var(--fg2)">Peso entregado</div>
            <div style="font-size:16px;font-weight:800;color:#0369A1">${(s.peso_total||0).toLocaleString('es-CO')} kg</div>
          </div>
          <div style="background:var(--bg);border-radius:6px;padding:6px 8px;border:1px solid var(--border)">
            <div style="font-size:10px;color:var(--fg2)">Bono conductor</div>
            <div style="font-size:14px;font-weight:700;color:${(s.bono_c||0)>=0?'#059669':'#DC2626'}">${fmtCurrency(s.bono_c||0)}</div>
          </div>
          <div style="background:var(--bg);border-radius:6px;padding:6px 8px;border:1px solid var(--border)">
            <div style="font-size:10px;color:var(--fg2)">Bono ayudante</div>
            <div style="font-size:14px;font-weight:700;color:var(--fg)">${fmtCurrency(s.bono_a||0)}</div>
          </div>
        </div>
      </div>
    `;
  }).join('') || '<p style="color:var(--fg2);padding:20px">Sin datos de conductores.</p>';

  // Renderizar mini-categorías por conductor
  conductores.forEach(c => {
    const el2 = document.getElementById(`res-cat-${c.clave}`);
    if (el2) renderStackChartEl(facturas.filter(f => f.cond_key === c.clave), el2, true);
  });
}

// Versión reutilizable de renderStackChart que acepta un elemento destino
function renderStackChartEl(facts, el, mini = false) {
  if (!el) return;

  // Rubros con bono unitario conductor y ayudante
  const RUBROS = [
    { key: 'D0',   label: 'Mismo día',       desc: '≤ 24 horas',   color: '#059669', vc:  6000, va:  3000 },
    { key: 'D1',   label: '1 día',           desc: '≤ 1 día',      color: '#10B981', vc:  6000, va:  3000 },
    { key: 'D2',   label: '2 días',          desc: '≤ 2 días',     color: '#34D399', vc:  5000, va:  2500 },
    { key: 'D5',   label: 'Hasta 5 días',    desc: '3 – 5 días',   color: '#FCD34D', vc:  4000, va:  2000 },
    { key: 'T10',  label: 'Demora leve',     desc: '5 – 10 días',  color: '#FB923C', vc:  -400, va:  -200 },
    { key: 'T20',  label: 'Demora media',    desc: '10 – 20 días', color: '#F97316', vc:  -800, va:  -400 },
    { key: 'T30',  label: 'Demora alta',     desc: '20 – 30 días', color: '#EF4444', vc: -2000, va: -1000 },
    { key: 'MT',   label: 'Nota traslado',   desc: 'Sin bono/castigo', color: '#94A3B8', vc: 0, va: 0 },
  ];

  const cats = Object.fromEntries(RUBROS.map(r => [r.key, 0]));
  facts.forEach(f => {
    if (tipoEsMT(f.tipo)) { cats['MT']++; return; }
    const d = getDias(f);
    if (d === null) return;
    if (d <= 0)       cats['D0']++;
    else if (d <= 1)  cats['D1']++;
    else if (d <= 2)  cats['D2']++;
    else if (d <= 5)  cats['D5']++;
    else if (d <= 10) cats['T10']++;
    else if (d <= 20) cats['T20']++;
    else              cats['T30']++;
  });

  // Castigo real por días exactos (igual que calcBono)
  const bonoRealCond = facts.reduce((s, f) => s + calcBono(getDias(f), tipoEsMT(f.tipo)), 0);
  const bonoRealAyud = bonoRealCond / 2;

  const total = Object.values(cats).reduce((a, b) => a + b, 0) || 1;

  const stackSegs = RUBROS.map(r =>
    cats[r.key] > 0
      ? `<div style="width:${(cats[r.key]/total*100).toFixed(1)}%;background:${r.color};height:100%;transition:width .3s" title="${r.label}: ${cats[r.key]}"></div>`
      : ''
  ).join('');

  if (mini) {
    const leyenda = RUBROS.filter(r => cats[r.key] > 0).map(r =>
      `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--fg2)">
         <span style="width:8px;height:8px;border-radius:2px;background:${r.color};display:inline-block"></span>
         ${r.label} <strong style="color:var(--fg)">${cats[r.key]}</strong>
       </span>`
    ).join('');
    el.innerHTML = `
      <div style="height:8px;border-radius:4px;overflow:hidden;display:flex;gap:2px;margin-bottom:6px">${stackSegs}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${leyenda}</div>
    `;
  } else {
    // Vista detallada: rubro + cant + bono unitario + total acumulado conductor + ayudante
    const rows = RUBROS.map(r => {
      const v = cats[r.key];
      const totalC = v * r.vc;
      const totalA = v * r.va;
      const pct = (v / total * 100).toFixed(0);
      const clrC = r.vc > 0 ? '#059669' : r.vc < 0 ? '#DC2626' : 'var(--fg2)';
      const clrA = r.va > 0 ? '#059669' : r.va < 0 ? '#DC2626' : 'var(--fg2)';
      return `
        <div style="display:grid;grid-template-columns:4px 1fr auto auto auto;align-items:center;gap:10px;
                    padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">
          <div style="height:36px;border-radius:4px;background:${r.color}"></div>
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--fg)">${r.label}</div>
            <div style="font-size:10px;color:var(--fg2)">${r.desc}</div>
          </div>
          <!-- Cantidad -->
          <div style="text-align:center;min-width:36px">
            <div style="font-size:18px;font-weight:800;color:var(--fg);line-height:1">${v}</div>
            <div style="font-size:9px;color:var(--fg2)">${pct}%</div>
          </div>
          <!-- Conductor -->
          <div style="text-align:right;min-width:80px">
            <div style="font-size:9px;color:var(--fg2);margin-bottom:2px">Conductor</div>
            <div style="font-size:9px;color:${clrC};opacity:.8">${r.vc !== 0 ? (r.vc > 0 ? '+' : '') + fmtCurrency(r.vc) + ' c/u' : '—'}</div>
            <div style="font-size:13px;font-weight:800;color:${clrC};line-height:1.3">${totalC !== 0 ? (totalC > 0 ? '+' : '') + fmtCurrency(totalC) : v === 0 ? '—' : '$0'}</div>
          </div>
          <!-- Ayudante -->
          <div style="text-align:right;min-width:80px">
            <div style="font-size:9px;color:var(--fg2);margin-bottom:2px">Ayudante</div>
            <div style="font-size:9px;color:${clrA};opacity:.8">${r.va !== 0 ? (r.va > 0 ? '+' : '') + fmtCurrency(r.va) + ' c/u' : '—'}</div>
            <div style="font-size:13px;font-weight:800;color:${clrA};line-height:1.3">${totalA !== 0 ? (totalA > 0 ? '+' : '') + fmtCurrency(totalA) : v === 0 ? '—' : '$0'}</div>
          </div>
        </div>
      `;
    }).join('');

    // Fila total
    const clrNetC = bonoRealCond >= 0 ? '#059669' : '#DC2626';
    const clrNetA = bonoRealAyud >= 0 ? '#059669' : '#DC2626';

    el.innerHTML = `
      <div style="height:10px;border-radius:6px;overflow:hidden;display:flex;gap:2px;margin-bottom:10px">${stackSegs}</div>
      <div style="display:grid;grid-template-columns:4px 1fr auto auto auto;gap:10px;
                  padding:4px 10px 6px;font-size:9px;color:var(--fg2);font-weight:600;text-transform:uppercase;letter-spacing:.4px">
        <div></div><div>Rubro</div>
        <div style="text-align:center">Cant.</div>
        <div style="text-align:right;min-width:72px">Conductor</div>
        <div style="text-align:right;min-width:72px">Ayudante</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">${rows}</div>
      <div style="display:grid;grid-template-columns:4px 1fr auto auto auto;align-items:center;gap:10px;
                  padding:8px 10px;border-radius:8px;background:var(--surface);border:2px solid var(--border);margin-top:8px">
        <div></div>
        <div style="font-size:12px;font-weight:800;color:var(--fg)">BONO NETO</div>
        <div></div>
        <div style="text-align:right;min-width:72px;font-size:14px;font-weight:800;color:${clrNetC}">${(bonoRealCond >= 0 ? '+' : '') + fmtCurrency(bonoRealCond)}</div>
        <div style="text-align:right;min-width:72px;font-size:14px;font-weight:800;color:${clrNetA}">${(bonoRealAyud >= 0 ? '+' : '') + fmtCurrency(bonoRealAyud)}</div>
      </div>
    `;
  }
}

function renderDailyChart(facts, color, elId = 'daily-chart') {
  const el = document.getElementById(elId);
  if (!el) return;

  // Agrupar entregas por fec_entr (solo las entregadas, no NTs sin entrega)
  const byDay = {};
  facts.forEach(f => {
    if (!f.fec_entr) return;
    const d = f.fec_entr.slice(0, 10);
    if (!byDay[d]) byDay[d] = { total: 0, ok: 0, tarde: 0 };
    byDay[d].total++;
    const dias = getDias(f);
    if (dias !== null && dias <= 5) byDay[d].ok++;
    else if (dias !== null) byDay[d].tarde++;
  });

  const days = Object.keys(byDay).sort();
  if (!days.length) { el.innerHTML = '<p style="color:var(--fg2);font-size:12px">Sin entregas.</p>'; return; }

  const W = 700, H = 160, padL = 32, padR = 12, padT = 20, padB = 36;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const maxVal = Math.max(...days.map(d => byDay[d].total), 1);
  const slotW = chartW / days.length;
  const gap   = 2;
  const barW  = Math.max(6, Math.min(18, (slotW - gap * 4) / 3));
  const yBase = padT + chartH;

  const bars = days.map((d, i) => {
    const v   = byDay[d];
    const cx  = padL + i * slotW + slotW / 2;
    const x1  = cx - barW * 1.5 - gap;   // Total
    const x2  = cx - barW / 2;           // A tiempo
    const x3  = cx + barW / 2 + gap;     // Tarde
    const tH  = Math.max(v.total > 0 ? 2 : 0, Math.round((v.total / maxVal) * chartH));
    const oH  = Math.max(v.ok    > 0 ? 2 : 0, Math.round((v.ok    / maxVal) * chartH));
    const rdH = Math.max(v.tarde > 0 ? 2 : 0, Math.round((v.tarde / maxVal) * chartH));
    const label = 'día ' + d.slice(8);
    return `
      <rect x="${x1.toFixed(1)}" y="${yBase-tH}"  width="${barW}" height="${tH}"  fill="#1e3a5f" rx="2"/>
      <text x="${(x1+barW/2).toFixed(1)}" y="${yBase-tH-3}"  text-anchor="middle" font-size="9" fill="var(--fg2)">${v.total}</text>
      <rect x="${x2.toFixed(1)}" y="${yBase-oH}"  width="${barW}" height="${oH}"  fill="#059669" rx="2"/>
      <text x="${(x2+barW/2).toFixed(1)}" y="${yBase-oH-3}"  text-anchor="middle" font-size="9" fill="#059669">${v.ok}</text>
      <rect x="${x3.toFixed(1)}" y="${yBase-rdH}" width="${barW}" height="${rdH}" fill="#EF4444" rx="2"/>
      <text x="${(x3+barW/2).toFixed(1)}" y="${yBase-rdH-3}" text-anchor="middle" font-size="9" fill="#EF4444">${v.tarde}</text>
      <text x="${cx}" y="${yBase+13}" text-anchor="middle" font-size="8.5" fill="var(--fg2)">${label}</text>
    `;
  }).join('');

  // Eje Y: marcas desde 0 hasta maxVal
  const yStepCount = Math.min(maxVal, 5);
  const yStepVal   = Math.ceil(maxVal / yStepCount);
  const yTicks     = [];
  for (let n = 0; n <= maxVal; n += yStepVal) yTicks.push(n);
  if (yTicks[yTicks.length - 1] < maxVal) yTicks.push(maxVal);

  const guides = yTicks.map(n => {
    const y = (yBase - Math.round((n / maxVal) * chartH)).toFixed(1);
    const isZero = n === 0;
    return `
      <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"
            stroke="var(--border)" stroke-width="${isZero ? 1.2 : 0.6}"
            ${isZero ? '' : 'stroke-dasharray="4,3"'}/>
      <text x="${(padL - 5).toFixed(1)}" y="${(parseFloat(y) + 3).toFixed(1)}"
            text-anchor="end" font-size="9" fill="var(--fg2)" font-weight="${isZero ? '600' : '400'}">${n}</text>
    `;
  }).join('');

  // Línea vertical del eje Y + etiqueta "Cantidad"
  const yAxis = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${yBase}"
                        stroke="var(--border)" stroke-width="1.2"/>
    <text x="${padL - 22}" y="${(padT + (chartH / 2)).toFixed(1)}"
          text-anchor="middle" font-size="9" fill="var(--fg2)"
          transform="rotate(-90,${padL - 22},${(padT + (chartH / 2)).toFixed(1)})">Cantidad</text>`;

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${guides}${yAxis}
      ${bars}
    </svg>
    <div style="display:flex;gap:16px;font-size:11px;color:var(--fg2);margin-top:4px;padding-left:4px">
      <span style="display:flex;align-items:center;gap:5px"><span style="width:11px;height:11px;background:#1e3a5f;border-radius:3px;display:inline-block;flex-shrink:0"></span>Total</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:11px;height:11px;background:#059669;border-radius:3px;display:inline-block;flex-shrink:0"></span>A tiempo (≤5d)</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:11px;height:11px;background:#EF4444;border-radius:3px;display:inline-block;flex-shrink:0"></span>Tarde</span>
    </div>
  `;
}

function getMiPanelRows() {
  let rows = facturas.filter(f => !session.cond_key || f.cond_key === session.cond_key);
  const q = (document.getElementById('mi-search')?.value || '').toLowerCase();
  const est = document.getElementById('mi-estado')?.value || '';
  const srt = document.getElementById('mi-sort')?.value || 'fecha_desc';
  if (q) rows = rows.filter(f =>
    (f.num||'').toLowerCase().includes(q) ||
    (f.cliente||'').toLowerCase().includes(q) ||
    (f.ciudad||'').toLowerCase().includes(q)
  );
  if (est === 'ok') rows = rows.filter(f => { const d = getDias(f); return d !== null && d <= 5 && !tipoEsMT(f.tipo); });
  if (est === 'tarde') rows = rows.filter(f => { const d = getDias(f); return d !== null && d > 5 && !tipoEsMT(f.tipo); });
  if (est === 'pend') rows = rows.filter(f => !f.fec_entr);
  rows.sort((a, b) => {
    if (srt === 'fecha_asc') return (a.fec_fact||'').localeCompare(b.fec_fact||'');
    if (srt === 'fecha_desc') return (b.fec_fact||'').localeCompare(a.fec_fact||'');
    const ba = calcBono(getDias(a), tipoEsMT(a.tipo));
    const bb = calcBono(getDias(b), tipoEsMT(b.tipo));
    return srt === 'bono_desc' ? bb - ba : ba - bb;
  });
  return rows;
}

function miPanelFilter() {
  miPanelPage = 0;
  const rows = getMiPanelRows();
  renderMiPanelSummary(rows);
  renderMiPanelTable(rows);
}

function renderMiPanelSummary(rows) {
  const el = document.getElementById('mi-summary');
  if (!el) return;
  const total = rows.length;
  const aTiempo = rows.filter(f => { const d = getDias(f); return d !== null && d <= 5 && !tipoEsMT(f.tipo) && f.fec_entr; }).length;
  const tarde   = rows.filter(f => { const d = getDias(f); return d !== null && d > 5  && !tipoEsMT(f.tipo) && f.fec_entr; }).length;
  const pend    = rows.filter(f => !f.fec_entr && !tipoEsMT(f.tipo)).length;
  const nts     = rows.filter(f => tipoEsMT(f.tipo)).length;
  const bonoNeto = rows.reduce((s, f) => s + calcBono(getDias(f), tipoEsMT(f.tipo)), 0);
  el.innerHTML = `
    <div class="summary-boxes">
      <div class="sum-box"><div class="sum-label">Total</div><div class="sum-value">${total}</div></div>
      <div class="sum-box"><div class="sum-label">A Tiempo</div><div class="sum-value ok">${aTiempo}</div></div>
      <div class="sum-box"><div class="sum-label">Tarde</div><div class="sum-value danger">${tarde}</div></div>
      <div class="sum-box"><div class="sum-label">Pendientes</div><div class="sum-value warn">${pend}</div></div>
      <div class="sum-box"><div class="sum-label">NTs</div><div class="sum-value">${nts}</div></div>
      <div class="sum-box"><div class="sum-label">Bono Neto</div><div class="sum-value ${bonoNeto >= 0 ? 'ok' : 'danger'}">${fmtCurrency(bonoNeto)}</div></div>
    </div>
  `;
}

function renderMiPanelTable(rows) {
  const tbody = document.getElementById('mi-tbody');
  const pag = document.getElementById('mi-pag');
  if (!tbody) return;
  const total = rows.length;
  const pages = Math.ceil(total / PAG_SIZE) || 1;
  miPanelPage = Math.min(miPanelPage, pages - 1);
  const slice = rows.slice(miPanelPage * PAG_SIZE, (miPanelPage + 1) * PAG_SIZE);

  tbody.innerHTML = slice.map(f => {
    const dias = getDias(f);
    const esMT = tipoEsMT(f.tipo);
    const bono = calcBono(dias, esMT);
    const bonoCls = bono > 0 ? 'chip-ok' : bono < 0 ? 'chip-danger' : 'chip-neutral';
    let estadoChip = '';
    if (!f.fec_entr) estadoChip = `<span class="chip chip-warn">Pendiente</span>`;
    else if (esMT) estadoChip = `<span class="chip chip-neutral">MT</span>`;
    else if (dias <= 0) estadoChip = `<span class="chip chip-ok">D0</span>`;
    else if (dias <= 5) estadoChip = `<span class="chip chip-ok">A tiempo</span>`;
    else estadoChip = `<span class="chip chip-danger">Tarde</span>`;

    return `<tr>
      <td><code style="font-size:12px">${f.num || '—'}</code></td>
      <td>${tipoChip(f.tipo)}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${f.cliente||''}">${f.cliente || '—'}</td>
      <td>${f.ciudad || '—'}</td>

const JFACT_SIZE = 12;
let jfPage = 0;
let jfCond = 'all';
let jfSearch = '';

function renderFacturasJefe() {
  const el = document.getElementById('page-facturas-jefe');
  const total = facturas.length;
  const aTiempo = facturas.filter(f => { const d = getDias(f); return d !== null && d <= 5 && !tipoEsMT(f.tipo) && f.fec_entr; }).length;
  const pend = facturas.filter(f => !f.fec_entr).length;
  const bonoNeto = facturas.reduce((s, f) => s + calcBono(getDias(f), tipoEsMT(f.tipo)), 0);

  const condKeys = [...new Set(facturas.map(f => f.cond_key).filter(Boolean))];

  el.innerHTML = `
    <div class="section-header">
      <h2>Facturas</h2>
      <p>Todas las facturas del equipo · ${mesActivo}</p>
    </div>
    <div class="kpi-grid" style="margin-bottom:16px">
      <div class="kpi"><div class="kpi-label">Total</div><div class="kpi-value">${total}</div></div>
      <div class="kpi ok"><div class="kpi-label">A Tiempo</div><div class="kpi-value">${aTiempo}</div></div>
      <div class="kpi warn"><div class="kpi-label">Pendientes</div><div class="kpi-value">${pend}</div></div>
      <div class="kpi ${bonoNeto >= 0 ? 'ok' : 'danger'}"><div class="kpi-label">Bono Total</div><div class="kpi-value" style="font-size:18px">${fmtCurrency(bonoNeto)}</div></div>
    </div>

    <div class="pill-group" id="jf-pills">
      <button class="pill active" data-cond="all" onclick="jfSetCond('all')">Todos</button>
      ${condKeys.map(k => `<button class="pill" data-cond="${k}" onclick="jfSetCond('${k}')" style="color:${COND_COLORS[k]||'inherit'}">${k}</button>`).join('')}
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">Facturas</span>
        <select class="form-select" id="jf-mes" onchange="jfChangeMes(this.value)">
          ${meses.map(m => `<option value="${m}" ${m===mesActivo?'selected':''}>${m}</option>`).join('')}
        </select>
        <input class="search-input" id="jf-search" placeholder="Buscar…" oninput="jfFilter()" style="width:160px">
        <select class="form-select" id="jf-estado" onchange="jfFilter()">
          <option value="">Todos</option>
          <option value="ok">A tiempo</option>
          <option value="tarde">Tarde</option>
          <option value="pend">Pendiente</option>
        </select>
      </div>
      <div class="table-scroller">
        <table>
          <thead><tr>
            <th>Conductor</th><th>Número</th><th>Tipo</th><th>Cliente</th><th>Ciudad</th>
            <th>F. Factura</th><th>F. Promesa</th><th>F. Entrega</th>
            <th>Días</th><th>Valor</th><th>Estado</th><th>Bono</th>
          </tr></thead>
          <tbody id="jf-tbody"></tbody>
        </table>
      </div>
      <div class="table-pagination" id="jf-pag"></div>
    </div>
  `;
  jfFilter();
}

function jfSetCond(cond) {
  jfCond = cond;
  jfPage = 0;
  document.querySelectorAll('#jf-pills .pill').forEach(p => p.classList.toggle('active', p.dataset.cond === cond));
  jfFilter();
}

function getJfRows() {
  let rows = [...facturas];
  if (jfCond !== 'all') rows = rows.filter(f => f.cond_key === jfCond);
  const q = (document.getElementById('jf-search')?.value || '').toLowerCase();
  const est = document.getElementById('jf-estado')?.value || '';
  if (q) rows = rows.filter(f =>
    (f.num||'').toLowerCase().includes(q) ||
    (f.cliente||'').toLowerCase().includes(q) ||
    (f.cond_key||'').toLowerCase().includes(q) ||
    (f.ciudad||'').toLowerCase().includes(q)
  );
  if (est === 'ok') rows = rows.filter(f => { const d = getDias(f); return d !== null && d <= 5 && !tipoEsMT(f.tipo) && f.fec_entr; });
  if (est === 'tarde') rows = rows.filter(f => { const d = getDias(f); return d !== null && d > 5 && !tipoEsMT(f.tipo); });
  if (est === 'pend') rows = rows.filter(f => !f.fec_entr);
  return rows;
}

function jfFilter() {
  jfPage = 0;
  const rows = getJfRows();
  renderJfTable(rows);
}

function renderJfTable(rows) {
  const tbody = document.getElementById('jf-tbody');
  const pag = document.getElementById('jf-pag');
  if (!tbody) return;
  const total = rows.length;
  const pages = Math.ceil(total / JFACT_SIZE) || 1;
  jfPage = Math.min(jfPage, pages - 1);
  const slice = rows.slice(jfPage * JFACT_SIZE, (jfPage + 1) * JFACT_SIZE);

  tbody.innerHTML = slice.map(f => {
    const dias = getDias(f);
    const esMT = tipoEsMT(f.tipo);
    const bono = calcBono(dias, esMT);
    const color = COND_COLORS[f.cond_key] || '#64748B';
    const bonoCls = bono > 0 ? 'chip-ok' : bono < 0 ? 'chip-danger' : 'chip-neutral';
    let estadoChip = '';
    if (!f.fec_entr) estadoChip = `<span class="chip chip-warn">Pendiente</span>`;
    else if (esMT) estadoChip = `<span class="chip chip-neutral">MT</span>`;
    else if (dias <= 0) estadoChip = `<span class="chip chip-ok">D0</span>`;
    else if (dias <= 5) estadoChip = `<span class="chip chip-ok">A tiempo</span>`;
    else estadoChip = `<span class="chip chip-danger">Tarde</span>`;

    return `<tr>
      <td><span style="color:${color};font-weight:700;font-size:12px">${f.cond_key || '—'}</span></td>
      <td><code style="font-size:11px">${f.num || '—'}</code></td>
      <td>${tipoChip(f.tipo)}</td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${f.cliente||''}">${f.cliente || '—'}</td>
      <td style="font-size:12px">${f.ciudad || '—'}</td>
      <td style="font-size:11px;color:var(--fg2)">${fmtDate(f.fec_fact)}</td>
      <td style="font-size:11px;color:var(--fg2)">${fmtDate(f.fec_promesa)}</td>
      <td style="font-size:11px;color:var(--fg2)">${fmtDate(f.fec_entr)}</td>
      <td style="text-align:center;font-size:12px">${dias !== null ? dias : '—'}</td>
      <td style="font-size:12px">${fmtCurrency(f.valor)}</td>
      <td>${estadoChip}</td>
      <td><span class="chip ${bonoCls}">${esMT ? '—' : fmtCurrency(bono)}</span></td>
    </tr>`;
  }).join('') || '<tr><td colspan="12" style="text-align:center;color:var(--fg2);padding:24px">Sin facturas</td></tr>';

  if (pag) pag.innerHTML = `
    <button class="pag-btn" onclick="jfGoPage(${jfPage - 1})" ${jfPage === 0 ? 'disabled' : ''}>← Ant.</button>
    <span class="pag-info">Página ${jfPage + 1} de ${pages} · ${total} registros</span>
    <button class="pag-btn" onclick="jfGoPage(${jfPage + 1})" ${jfPage >= pages - 1 ? 'disabled' : ''}>Sig. →</button>
  `;
}

function jfGoPage(p) {
  jfPage = p;
  renderJfTable(getJfRows());
}

async function jfChangeMes(mes) {
  mesActivo = mes;
  showLoading('Cargando facturas…');
  await loadFacturas();
  hideLoading();
  renderFacturasJefe();
}

let adminActiveTab = 'facturas';
const adminFileMap = {};
const adminPreviewMap = {};

const SCHEMAS = {
